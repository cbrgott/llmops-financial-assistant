services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-assistant
    container_name: financial-assistant-ingest
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    command: python app/ingest.py
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-assistant
    container_name: financial-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      ingest:
        condition: service_completed_successfully
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000