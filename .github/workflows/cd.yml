name: LLMOps CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/financial-assistant:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/financial-assistant:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/financial-assistant:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/financial-assistant:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy Financial Assistant API
        run: |
          az containerapp update \
            --name financial-assistant-api \
            --resource-group demo-container \
            --image ghcr.io/${{ github.repository }}/financial-assistant:${{ github.sha }}

      - name: Deploy MCP Server
        run: |
          az containerapp update \
            --name financial-assistant-mcp \
            --resource-group demo-container \
            --image ghcr.io/${{ github.repository }}/financial-assistant:${{ github.sha }}