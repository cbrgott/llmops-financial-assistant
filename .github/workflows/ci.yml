name: LLMOps CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  test:

    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Wait for Qdrant
      run: |
        sleep 5

    - name: Ingest documents into Qdrant
      run: |
        python app/ingest.py

    - name: Run tests
      run: |
        pytest